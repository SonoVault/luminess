<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ommathos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='20' fill='%2300c896'/><circle cx='50' cy='50' r='12' fill='%23e0f5ef'/></svg>">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#071510;--navy2:#0d2018;--navy3:#123020;
  --em:#00c896;--em2:#00e8b0;--em3:#00a878;
  --beige:#e0f5ef;--beige2:#d0ede6;--beige3:#f0faf7;--beige4:#fff;
  --text-dark:#0a2018;--text-mid:#2a5040;--text-soft:#5a8878;--text-beige:#60a890;
  --accent:#00a878;--accent2:#00c896;
  --success:#2d7a4f;--success-bg:#e8f5ee;
  --danger:#b91c1c;--danger-bg:#fef2f2;
  --warning:#92600a;--warning-bg:#fefce8;
  --border:#b0ddd0;--border2:#80c8b8;
  --radius:8px;--radius-lg:12px;
  --font:'Georgia','Times New Roman',serif;
  --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sw:264px;
}
html,body{height:100%;font-family:var(--ui);background:var(--beige3);color:var(--text-dark);overflow:hidden}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:linear-gradient(145deg,#030a08 0%,#071510 60%,#0d2018 100%);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:28px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:16px}
.login-title{font-family:var(--font);font-size:36px;font-weight:400;color:var(--beige);letter-spacing:3px}
.login-title b{font-weight:700;color:var(--em2)}
.login-subtitle{font-size:12px;color:rgba(0,200,150,0.45);letter-spacing:1px}
.login-btn{display:flex;align-items:center;gap:10px;background:var(--beige);border:none;border-radius:8px;padding:13px 28px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;font-family:var(--ui);transition:all .15s}
.login-btn:hover{background:#d0ede6;transform:translateY(-1px)}
.login-btn svg{width:20px;height:20px}
.login-status{font-size:12px;color:rgba(0,200,150,0.3);margin-top:-12px}

/* APP */
.app{display:flex;height:100vh;flex-direction:column}
.topbar{background:var(--navy);height:50px;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;border-bottom:0.5px solid rgba(0,200,150,0.1)}
.logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-name{font-family:var(--font);font-size:16px;font-weight:400;color:var(--beige);letter-spacing:1px}
.logo-name b{font-weight:700;color:var(--em2)}
.top-sep{flex:1}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(0,200,150,0.45)}
.bc{cursor:pointer;transition:color .12s}
.bc:hover{color:var(--beige)}
.bc.active{color:rgba(0,200,150,0.85)}
.user-pill{display:flex;align-items:center;gap:6px;background:rgba(0,200,150,0.07);border:0.5px solid rgba(0,200,150,0.15);border-radius:20px;padding:3px 9px 3px 3px}
.uav{width:22px;height:22px;border-radius:50%;background:var(--em);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--navy)}
.unm{font-size:11px;color:rgba(0,200,150,0.7)}
.tbtn{background:transparent;border:0.5px solid rgba(0,200,150,0.25);border-radius:6px;padding:4px 10px;color:rgba(0,200,150,0.75);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:var(--ui);transition:all .12s;white-space:nowrap}
.tbtn:hover{background:rgba(0,200,150,0.08);color:var(--em2)}
.tbtn.cta{background:var(--em);border-color:var(--em);color:var(--navy);font-weight:600}
.tbtn.cta:hover{background:var(--em2)}
.tbtn.logout{border-color:rgba(0,200,150,0.1);color:rgba(0,200,150,0.35)}
.saving{display:none;align-items:center;gap:4px;font-size:10px;color:rgba(0,200,150,0.4)}
.saving.on{display:flex}
.main-layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--navy2);display:flex;flex-direction:column;border-right:0.5px solid rgba(0,200,150,0.08)}
.sb-top{padding:11px 11px 7px;flex-shrink:0}
.sb-search{background:rgba(0,200,150,0.06);border:0.5px solid rgba(0,200,150,0.12);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--beige);outline:none;width:100%;font-family:var(--ui)}
.sb-search::placeholder{color:rgba(0,200,150,0.28)}
.sb-list{flex:1;overflow-y:auto;padding:2px 0 6px}
.l1{user-select:none}
.l1-hd{display:flex;align-items:center;padding:6px 10px 6px 11px;cursor:pointer;gap:5px}
.l1-hd:hover{background:rgba(0,200,150,0.04)}
.l1-arr{font-size:10px;color:rgba(0,200,150,0.28);transition:transform .14s;flex-shrink:0}
.l1-arr.o{transform:rotate(90deg)}
.l1-name{font-size:10px;font-weight:700;color:rgba(0,200,150,0.5);letter-spacing:0.7px;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l1-cnt{font-size:9px;color:rgba(0,200,150,0.22);background:rgba(0,200,150,0.06);border-radius:8px;padding:1px 5px;flex-shrink:0}
.l1-del{font-size:11px;color:rgba(0,200,150,0.15);cursor:pointer;opacity:0;padding:2px;flex-shrink:0}
.l1-hd:hover .l1-del{opacity:1}
.l1-del:hover{color:#fca5a5}
.l1-body{display:none;padding-bottom:2px}
.l1-body.o{display:block}
.l2{user-select:none}
.l2-hd{display:flex;align-items:center;padding:5px 10px 5px 20px;cursor:pointer;gap:5px}
.l2-hd:hover{background:rgba(0,200,150,0.04)}
.l2-arr{font-size:10px;color:rgba(0,200,150,0.2);transition:transform .14s;flex-shrink:0}
.l2-arr.o{transform:rotate(90deg)}
.l2-name{font-size:12px;font-weight:500;color:rgba(0,200,150,0.55);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2-cnt{font-size:9px;color:rgba(0,200,150,0.18);background:rgba(0,200,150,0.05);border-radius:8px;padding:1px 5px;flex-shrink:0}
.l2-del{font-size:11px;color:rgba(0,200,150,0.1);cursor:pointer;opacity:0;padding:1px;flex-shrink:0}
.l2-hd:hover .l2-del{opacity:1}
.l2-del:hover{color:#fca5a5}
.l2-body{display:none;padding-bottom:2px}
.l2-body.o{display:block}
.l3{display:flex;align-items:center;gap:5px;padding:5px 10px 5px 30px;cursor:pointer;font-size:12px;color:rgba(0,200,150,0.48);transition:all .12s}
.l3:hover{background:rgba(0,200,150,0.06);color:rgba(0,200,150,0.85)}
.l3.active{background:rgba(0,200,150,0.12);color:var(--em2);font-weight:500}
.l3-dot{width:4px;height:4px;border-radius:50%;background:rgba(0,200,150,0.2);flex-shrink:0}
.l3.active .l3-dot{background:var(--em2)}
.l3-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3-wiki{width:5px;height:5px;border-radius:50%;background:var(--em);opacity:0.7;flex-shrink:0}
.l3-cnt{font-size:9px;color:rgba(0,200,150,0.2);background:rgba(0,200,150,0.06);border-radius:8px;padding:1px 5px;flex-shrink:0}
.l3.active .l3-cnt{color:rgba(0,200,150,0.5)}
.l3-del{font-size:10px;color:rgba(0,200,150,0.12);cursor:pointer;opacity:0;padding:1px 2px;flex-shrink:0}
.l3:hover .l3-del{opacity:1}
.l3-del:hover{color:#fca5a5}
.sb-add{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:rgba(0,200,150,0.28);transition:all .12s;border-radius:4px}
.sb-add:hover{color:rgba(0,200,150,0.65);background:rgba(0,200,150,0.04)}
.sb-add.a2{padding:4px 10px 4px 20px}
.sb-add.a3{padding:4px 10px 4px 30px}
.sb-add-cat{display:flex;align-items:center;gap:6px;padding:8px 13px;cursor:pointer;font-size:11px;color:rgba(0,200,150,0.32);transition:all .12s;border-top:0.5px solid rgba(0,200,150,0.08);margin-top:4px;flex-shrink:0}
.sb-add-cat:hover{background:rgba(0,200,150,0.05);color:rgba(0,200,150,0.65)}
.sb-footer{padding:9px 11px;border-top:0.5px solid rgba(0,200,150,0.08);flex-shrink:0}
.drive-ok{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(0,200,150,0.55)}
.mod-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:0.3px}
.mod-us{background:#e0f2fe;color:#0369a1}
.mod-tc{background:#f0fdf4;color:#15803d}
.mod-rx{background:#fdf4ff;color:#7e22ce}
.mod-rm{background:#fff7ed;color:#c2410c}
.content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* HOME */
.home{padding:24px}
.home h1{font-family:var(--font);font-size:22px;font-weight:400;color:var(--text-dark);margin-bottom:5px}
.home p{font-size:13px;color:var(--text-soft);line-height:1.6;margin-bottom:24px}
.recent-label{font-size:10px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:var(--text-soft);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.recent-label::after{content:'';flex:1;height:0.5px;background:var(--border)}
.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.home-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 20px;color:var(--text-beige);text-align:center}
.home-empty i{font-size:48px;color:var(--em3)}
.home-empty h3{font-size:15px;font-weight:400;font-family:var(--font);color:var(--text-mid)}
.home-empty p{font-size:12px;color:var(--text-soft);max-width:280px;line-height:1.6}

/* STRUCT PAGE */
.sp{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100%}
.sp-hd{padding:16px 22px 0;flex-shrink:0}
.sp-hd-top{display:flex;align-items:flex-start;gap:13px;margin-bottom:13px}
.sp-illus{width:64px;height:64px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;border:0.5px solid rgba(0,200,150,0.2)}
.sp-illus svg,.sp-illus img{width:100%;height:100%;object-fit:cover}
.sp-info{flex:1}
.sp-tag{font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--em3);margin-bottom:3px}
.sp-title{font-family:var(--font);font-size:19px;color:var(--text-dark);margin-bottom:3px}
.sp-meta{font-size:12px;color:var(--text-soft)}
.sp-tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 22px}
.sp-tab{padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text-soft);border-bottom:2px solid transparent;transition:all .12s;display:flex;align-items:center;gap:5px}
.sp-tab:hover{color:var(--text-dark)}
.sp-tab.active{color:var(--accent);border-bottom-color:var(--em)}
.sp-body{flex:1;overflow-y:auto}

/* GALLERY */
.gal-pane{padding:16px 22px}
.gal-bar{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.gal-search{flex:1;min-width:160px;position:relative}
.gal-search i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-soft);pointer-events:none}
.gal-search input{width:100%;background:var(--beige2);border:0.5px solid var(--border);border-radius:6px;padding:6px 10px 6px 28px;font-size:12px;color:var(--text-dark);outline:none;font-family:var(--ui)}
.gal-search input:focus{border-color:var(--em);background:#fff}
.gal-search input::placeholder{color:var(--text-soft)}
.gf{display:flex;gap:4px;flex-wrap:wrap}
.gf-b{padding:5px 9px;border-radius:5px;font-size:11px;cursor:pointer;border:0.5px solid var(--border);background:var(--beige2);color:var(--text-soft);transition:all .12s;font-family:var(--ui)}
.gf-b.on{background:var(--em);border-color:var(--em);color:var(--navy);font-weight:600}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.case-card{background:var(--beige4);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .15s}
.case-card:hover{border-color:var(--em3);box-shadow:0 4px 16px rgba(0,200,150,0.1);transform:translateY(-1px)}
.cc-photos{position:relative;height:180px;background:var(--beige2);overflow:hidden}
.cc-main-img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.cc-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);cursor:pointer}
.cc-play-btn{width:48px;height:48px;border-radius:50%;background:rgba(0,200,150,0.9);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:all .15s}
.cc-play-btn:hover{background:var(--em);transform:scale(1.08)}
.cc-play-btn i{font-size:20px;color:var(--navy);margin-left:3px}
.cc-thumbs{position:absolute;bottom:8px;left:8px;display:flex;gap:4px;align-items:center}
.cc-thumb{width:36px;height:36px;border-radius:5px;overflow:hidden;border:2px solid rgba(0,200,150,0.3);cursor:pointer;transition:all .12s;flex-shrink:0}
.cc-thumb:hover{border-color:var(--em);transform:scale(1.05)}
.cc-thumb.active{border-color:var(--em);box-shadow:0 0 0 1px var(--em2)}
.cc-thumb img{width:100%;height:100%;object-fit:cover}
.cc-add-photo{width:36px;height:36px;border-radius:5px;border:1.5px dashed rgba(0,200,150,0.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;background:rgba(0,0,0,0.15);flex-shrink:0}
.cc-add-photo:hover{border-color:var(--em);background:rgba(0,200,150,0.1)}
.cc-add-photo i{font-size:16px;color:rgba(0,200,150,0.7)}
.cc-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px}
.b-pat{background:var(--danger-bg);color:var(--danger)}
.b-norm{background:var(--success-bg);color:var(--success)}
.b-var{background:var(--warning-bg);color:var(--warning)}
.cc-photo-cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);color:white;font-size:10px;padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px}
.cc-body{padding:12px 14px}
.cc-lesion{font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:3px;line-height:1.3}
.cc-meta{font-size:11px;color:var(--text-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cc-desc{font-size:12px;color:var(--text-mid);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.cc-actions{display:flex;gap:5px;flex-wrap:nowrap}
.cc-btn{flex:1;min-width:0;padding:6px 4px;border-radius:6px;font-size:11px;cursor:pointer;border:0.5px solid var(--border);background:var(--beige2);color:var(--text-mid);font-family:var(--ui);transition:all .12s;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.cc-btn:hover{background:var(--em);color:var(--navy);border-color:var(--em);font-weight:600}
.cc-btn.atlas{background:var(--navy);border-color:var(--navy);color:var(--em2)}
.cc-btn.atlas:hover{background:var(--navy3)}
.cc-btn.del{flex:none;padding:6px 9px;color:var(--danger)}
.cc-btn.del:hover{background:var(--danger-bg);border-color:var(--danger)}
.gal-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;color:var(--text-beige);text-align:center}
.gal-empty i{font-size:38px;color:var(--em3)}
.gal-empty p{font-size:12px;color:var(--text-soft);max-width:200px;line-height:1.5}
.gal-new-btn{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 18px;background:var(--em);color:var(--navy);border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--ui)}

/* CV VIEWER */
.cv-overlay{position:fixed;inset:0;background:rgba(3,10,8,0.97);z-index:260;display:flex;flex-direction:column}
.cv-top{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0;border-bottom:0.5px solid rgba(0,200,150,0.1)}
.cv-title{font-family:var(--font);font-size:16px;color:var(--beige);flex:1}
.cv-meta{font-size:11px;color:rgba(0,200,150,0.4)}
.cv-close{background:rgba(0,200,150,0.08);border:none;border-radius:8px;color:var(--em);font-size:18px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.cv-close:hover{background:rgba(0,200,150,0.15)}
.cv-body{flex:1;display:flex;overflow:hidden}
.cv-main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:24px}
.cv-main-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.cv-main-video{max-width:100%;max-height:100%;border-radius:4px}
.cv-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,200,150,0.1);border:none;border-radius:8px;color:var(--em);font-size:20px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.cv-nav:hover{background:rgba(0,200,150,0.2)}
.cv-nav.prev{left:12px}
.cv-nav.next{right:12px}
.cv-sidebar{width:200px;min-width:200px;background:rgba(0,200,150,0.04);border-left:0.5px solid rgba(0,200,150,0.1);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.cv-sb-lbl{font-size:9px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:rgba(0,200,150,0.35);margin-bottom:4px}
.cv-thumb-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cv-sb-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:pointer;border:1.5px solid transparent}
.cv-sb-thumb.active{border-color:var(--em)}
.cv-sb-thumb img{width:100%;height:100%;object-fit:cover}
.cv-bottom{padding:12px 18px;border-top:0.5px solid rgba(0,200,150,0.1);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.cv-counter{font-size:11px;color:rgba(0,200,150,0.35)}
.cv-desc-txt{font-size:12px;color:rgba(0,200,150,0.55);max-width:600px;line-height:1.6}

/* ATLAS EDIT */
.ae-pane{padding:18px 22px;display:flex;flex-direction:column;gap:13px;max-width:760px}
.ae-sec{background:var(--beige4);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.ae-hd{padding:10px 15px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:9px;background:var(--beige2)}
.ae-ico{width:24px;height:24px;border-radius:5px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ae-ico i{font-size:12px;color:var(--em)}
.ae-ttl{font-size:13px;font-weight:600;color:var(--text-dark)}
.ae-bd{padding:13px 15px}
.ae-ta{width:100%;background:var(--beige3);border:0.5px solid var(--border);border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--text-dark);outline:none;font-family:var(--ui);resize:vertical;line-height:1.8;transition:border-color .15s}
.ae-ta:focus{border-color:var(--em);background:#fff}
.ae-ta::placeholder{color:var(--text-soft);font-style:italic}
.illus-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.illus-item{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;border:0.5px solid var(--border);cursor:pointer}
.illus-item img{width:100%;height:100%;object-fit:cover;transition:transform .15s}
.illus-item:hover img{transform:scale(1.05)}

function drawLogo(canvas,size,t){
  const ctx=canvas.getContext('2d');
  const cx=size/2,cy=size/2;
  ctx.clearRect(0,0,size,size);
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,size/2);
  bg.addColorStop(0,'rgba(0,40,25,0.9)');
  bg.addColorStop(1,'rgba(7,21,16,0)');

  const r0=50*sc,rIn=36*sc,rMid=50*sc,rOut=size/2-10*sc;
  const nRays=24;

    const angle=(i/nRays)*Math.PI*2+t*0.3;

    ctx.strokeStyle=`rgba(0,210,160,${alpha})`;
    ctx.lineWidth=isPrimary?1.5*sc:0.8*sc;
    ctx.lineCap='round';ctx.stroke();
  }
  for(let i=5;i>0;i--){
    const r=(55+i*18)*sc+Math.sin(t*0.8+i)*3*sc;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,200,150,${0.04+0.03*Math.sin(t+i*0.7)})`;
    ctx.lineWidth=(i===3?1.5:0.8)*sc;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,rMid,0,Math.PI*2);
  ctx.strokeStyle=`rgba(0,200,150,${0.6+0.2*Math.sin(t)})`;
  ctx.lineWidth=1.5*sc;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,rIn,0,Math.PI*2);
  ctx.strokeStyle=`rgba(0,230,170,${0.4+0.2*Math.sin(t*1.3)})`;
  ctx.lineWidth=1*sc;ctx.stroke();
  const pulse=(4*Math.sin(t*1.5))*sc;
  const core=ctx.createRadialGradient(cx,cy,0,cx,cy,(28+pulse/sc)*sc);
  core.addColorStop(0,'rgba(200,255,240,1)');
  core.addColorStop(0.2,'rgba(0,230,170,1)');
  core.addColorStop(0.5,'rgba(0,180,130,0.9)');
  core.addColorStop(0.8,'rgba(0,100,70,0.5)');
  core.addColorStop(1,'rgba(0,50,30,0)');
  ctx.beginPath();ctx.arc(cx,cy,(28+pulse/sc)*sc,0,Math.PI*2);
  ctx.fillStyle=core;ctx.fill();
  const inner=ctx.createRadialGradient(cx-3*sc,cy-3*sc,0,cx,cy,12*sc);
  inner.addColorStop(0,'rgba(240,255,250,1)');
  inner.addColorStop(0.4,'rgba(100,255,200,0.8)');
  inner.addColorStop(1,'rgba(0,200,150,0)');
  ctx.beginPath();ctx.arc(cx,cy,12*sc,0,Math.PI*2);
  ctx.fillStyle=inner;ctx.fill();
  for(let i=0;i<8;i++){
    const angle=(i/8)*Math.PI*2+t*0.5;
    const r=(70+Math.sin(t+i)*4)*sc;
    const px=cx+Math.cos(angle)*r,py=cy+Math.sin(angle)*r;
    const sz=(1.5+Math.sin(t*1.2+i)*0.8)*sc;
    ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,220,160,${0.4+0.3*Math.sin(t+i)})`;ctx.fill();
  }
}

async function dr(url,o={}){const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+tok,...(o.headers||{})}});if(!r.ok)throw new Error(r.status);return r}
async function mkFolder(){const q=encodeURIComponent(`name='${FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);const r=await dr(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);const d=await r.json();if(d.files?.length)return d.files[0].id;const c=await dr('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER,mimeType:'application/vnd.google-apps.folder'})});return(await c.json()).id}
async function getFileId(name){const q=encodeURIComponent(`name='${name}' and '${fId}' in parents and trashed=false`);const r=await dr(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);const d=await r.json();return d.files?.length?d.files[0].id:null}
async function saveFile(fileId,name,data){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});if(fileId){await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:blob});return fileId}const meta={name,parents:[fId]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob);const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok},body:form});return(await r.json()).id}
async function initDrive(){try{fId=await mkFolder();dbId=await getFileId('om-db.json');wId=await getFileId('om-wiki.json');cId=await getFileId('om-cats.json');if(dbId){const r=await dr(`https://www.googleapis.com/drive/v3/files/${dbId}?alt=media`);const d=await r.json();cases=Array.isArray(d)?d:[]}if(wId){const r=await dr(`https://www.googleapis.com/drive/v3/files/${wId}?alt=media`);const d=await r.json();wiki=d&&typeof d==='object'?d:{}}if(cId){const r=await dr(`https://www.googleapis.com/drive/v3/files/${cId}?alt=media`);const d=await r.json();cats=Array.isArray(d)?d:[]}updateStat();renderSB()}catch(e){toast('Erro no Drive','err')}}

s="ti ti-x l1-del" onclick="event.stopPropagation();delCat('${cat.id}')"></i></div><div class="l1-body ${op?'o':''}" id="cb${cat.id}">${sHtml}<div class="sb-add a2" onclick="openNS('${cat.id}')"><i class="ti ti-plus" style="font-size:10px"></i> Adicionar sistema</div></div></div>`;}el.innerHTML=html||'<div style="padding:14px;font-size:11px;color:rgba(0,200,150,0.28);text-align:center">Nenhum resultado</div>';}

e('${c.id}')"><i class="ti ti-plus"></i></div></div></div><div class="cc-body"><div class="cc-lesion">${c.lesion}${c.level?' — '+c.level:''}</div><div class="cc-meta">${c.modality?`<span class="mod-badge ${modClass(c.modality)}">${modLabel(c.modality)}</span>`:''} ${isHome&&str?`<span>${cat?.name||''} › ${str.name}</span>`:''}<span>${c.date?new Date(c.date).toLocaleDateString('pt-BR'):''}</span></div>${c.description?`<div class="cc-desc">${c.description}</div>`:''}<div class="cc-actions"><button class="cc-btn" onclick="event.stopPropagation();openCV('${c.id}',0)"><i class="ti ti-eye" style="font-size:11px"></i> Ver</button><button class="cc-btn" onclick="event.stopPropagation();openEditCase('${c.id}')"><i class="ti ti-edit" style="font-size:11px"></i> Editar</button>${hasW?`<button class="cc-btn atlas" onclick="event.stopPropagation();openAtlasFromCase('${c.id}')"><i class="ti ti-book" style="font-size:11px"></i> Atlas</button>`:''}<button class="cc-btn del" onclick="event.stopPropagation();deleteCase('${c.id}')"><i class="ti ti-trash" style="font-size:11px"></i></button></div></div></div>`}

function renderAR(el,w){
  const cat=gCat(cC);const sys=gSys(cC,cS);const str=gStr(cC,cS,cST);
  const illus=w.illus||[];
  const si=cases.filter(c=>c.catId===cC&&c.sysId===cS&&c.strId===cST);
  const allCaseImgs=[];
  si.forEach(c=>{(c.photos||[]).forEach((p,pi)=>{if(!isVideo(p))allCaseImgs.push({src:p,lesion:c.lesion})})});
  const siImgs=allCaseImgs.slice(0,6);
  const secs=[{id:'history',label:'HISTÓRIA'},{id:'anatomy',label:'ANATOMIA'},{id:'physio',label:'FISIOPATOLOGIA'},{id:'findings',label:'ACHADOS NO EXAME'},{id:'treatment',label:'TRATAMENTO'},{id:'refs',label:'REFERÊNCIAS',isRef:true}];
  const illusHtml=illus.length>0?
    illus.map((img,i)=>`<div class="ar-illus-item" data-illus="${i}"><img src="${img}" alt=""><div class="ar-illus-item-overlay"><i class="ti ti-zoom-in"></i></div></div>`).join('')+
    `<div class="ar-illus-add" onclick="document.getElementById('illus-fi').click()"><i class="ti ti-plus"></i><span>Adicionar</span></div>`:
    `<div class="ar-illus-item" style="grid-column:span 2;min-height:130px" onclick="document.getElementById('illus-fi').click()"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="20" stroke="#00c896" stroke-width="1.5" stroke-opacity="0.3"/></svg><div class="ar-illus-item-overlay"><i class="ti ti-photo-plus"></i></div></div>`;
  const mediaHtml=siImgs.map((x,i)=>`<div class="ar-img-mini" data-case="${i}"><img src="${x.src}" alt=""><div class="ar-img-mini-overlay"><i class="ti ti-zoom-in"></i></div></div>`).join('');
  el.innerHTML=`<div class="ar-pane"><div class="ar-hd"><div><div class="ar-title">${str?.name||''}</div><div class="ar-sub">${cat?.name||''} › ${sys?.name||''} · Atlas</div></div><div class="ar-actions"><button class="btn btn-g" style="font-size:11px" onclick="cAtlas='edit';renderTab()"><i class="ti ti-edit" style="font-size:11px"></i> Editar</button><button class="btn btn-p" style="font-size:11px" onclick="exportAtlasPDF()"><i class="ti ti-file-type-pdf" style="font-size:11px"></i> PDF</button></div></div><div class="ar-body"><div class="ar-left">${secs.map(s=>w[s.id]?`<div class="ar-sec"><div class="ar-sec-lbl">${s.label}</div>${s.isRef?`<div class="ar-refs">${w[s.id]}</div>`:`<div class="ar-sec-txt">${w[s.id]}</div>`}</div>`:'').join('')}</div><div class="ar-right"><div><div class="ar-right-lbl">Ilustrações anatômicas</div><div class="ar-illus-grid" id="ar-illus-grid">${illusHtml}</div></div>${siImgs.length?`<div style="margin-top:6px"><div class="ar-right-lbl">Banco de casos</div><div class="ar-imgs-grid" id="ar-imgs-grid">${mediaHtml}</div></div>`:`<div class="ar-empty"><i class="ti ti-circle-dotted"></i><p>Adicione casos na aba Imagens</p></div>`}</div></div></div>`;
  // bind clicks via addEventListener — evita problemas com JSON no onclick
  const illusArr=illus;
  el.querySelectorAll('[data-illus]').forEach(div=>{
    div.addEventListener('click',()=>openLB(illusArr,parseInt(div.dataset.illus),'Ilustração anatômica'))
  });
  const caseArr=siImgs.map(x=>x.src);
  const lesionArr=siImgs.map(x=>x.lesion);
  el.querySelectorAll('[data-case]').forEach(div=>{
    div.addEventListener('click',()=>{const i=parseInt(div.dataset.case);openLB(caseArr,i,lesionArr[i]||'')})
  });
}

function renderAE(el,w){const illus=w.illus||[];const secs=[{id:'history',icon:'ti-clock',title:'História',ph:'Ex: Descrito por...',h:110},{id:'anatomy',icon:'ti-bone',title:'Anatomia',ph:'Anatomia detalhada...',h:140},{id:'physio',icon:'ti-heart-rate-monitor',title:'Fisiopatologia',ph:'Mecanismos...',h:140},{id:'findings',icon:'ti-scan',title:'Achados no exame',ph:'Como aparece...',h:140},{id:'treatment',icon:'ti-stethoscope',title:'Tratamento',ph:'Conservador, injetáveis, cirurgia...',h:140},{id:'refs',icon:'ti-books',title:'Referências',ph:'StatPearls · AJR · Skeletal Radiology...',h:90}];const illusGrid=illus.map((img,i)=>`<div class="illus-item"><img src="${img}" alt=""><button class="illus-item-del" onclick="delIllus(${i})">✕</button></div>`).join('')+`<div class="illus-add-btn" onclick="document.getElementById('illus-fi').click()"><i class="ti ti-photo-plus"></i><span>Adicionar</span></div>`;el.innerHTML=`<div class="ae-pane"><div class="ae-sec"><div class="ae-hd"><div class="ae-ico"><i class="ti ti-photo"></i></div><div class="ae-ttl">Ilustrações anatômicas</div></div><div class="ae-bd"><div class="illus-grid">${illusGrid}</div></div></div>${secs.map(s=>`<div class="ae-sec"><div class="ae-hd"><div class="ae-ico"><i class="ti ${s.icon}"></i></div><div class="ae-ttl">${s.title}</div></div><div class="ae-bd"><textarea class="ae-ta" id="w-${s.id}" placeholder="${s.ph}" style="min-height:${s.h}px">${w[s.id]||''}</textarea></div></div>`).join('')}</div><div class="ae-footer"><button class="btn btn-g" onclick="cAtlas='read';renderTab()"><i class="ti ti-arrow-left" style="font-size:11px"></i> Cancelar</button><button class="btn btn-p" onclick="saveAtlas()"><i class="ti ti-check" style="font-size:11px"></i> Salvar</button></div>`}
function saveAtlas(){const k=wk();const prev=wiki[k]||{};wiki[k]={illus:prev.illus||[],history:v('w-history'),anatomy:v('w-anatomy'),physio:v('w-physio'),findings:v('w-findings'),treatment:v('w-treatment'),refs:v('w-refs')};schedW();cAtlas='read';renderSP();toast('Atlas salvo','ok')}
function v(id){return document.getElementById(id)?.value||''}
function delIllus(idx){const k=wk();if(!wiki[k]||!wiki[k].illus)return;wiki[k].illus.splice(idx,1);schedW();renderTab()}
function handleIllusFiles(inp){const files=Array.from(inp.files);if(!files.length)return;const k=wk();if(!wiki[k])wiki[k]={};if(!wiki[k].illus)wiki[k].illus=[];let loaded=0;files.forEach(f=>{if(f.size>5*1024*1024){toast('Máx. 5MB','err');return}const rd=new FileReader();rd.onload=e=>{wiki[k].illus.push(e.target.result);loaded++;if(loaded===files.length){schedW();renderSP();toast(loaded+' ilustração(ões) adicionada(s)','ok')}};rd.readAsDataURL(f)});inp.value=''}

// ADD/EDIT
function openAddModal(){eId=null;newPhotos=[];document.getElementById('img-ttl').textContent='Novo caso';show('img-mo');const cs=document.getElementById('im-cat');cs.innerHTML='<option value="">Selecionar...</option>'+cats.map(c=>`<option value="${c.id}"${c.id===cC?' selected':''}>${c.name}</option>`).join('');fillImgSys();['im-les','im-lvl','im-desc'].forEach(x=>document.getElementById(x).value='');document.getElementById('im-icat').value='patologia';document.getElementById('im-mod').value='us';renderImgPreviews()}
function openEditCase(id){eId=id;const c=cases.find(x=>x.id===id);if(!c)return;newPhotos=[...(c.photos||[])];document.getElementById('img-ttl').textContent='Editar caso';show('img-mo');const cs=document.getElementById('im-cat');cs.innerHTML='<option value="">Selecionar...</option>'+cats.map(x=>`<option value="${x.id}"${x.id===c.catId?' selected':''}>${x.name}</option>`).join('');fillImgSys(c.sysId,c.strId);document.getElementById('im-les').value=c.lesion||'';document.getElementById('im-icat').value=c.category||'patologia';document.getElementById('im-lvl').value=c.level||'';document.getElementById('im-desc').value=c.description||'';document.getElementById('im-mod').value=c.modality||'us';renderImgPreviews()}
function fillImgSys(selSys,selStr){const catId=document.getElementById('im-cat').value;const cat=gCat(catId);const ss=document.getElementById('im-sys');ss.innerHTML='<option value="">Selecionar...</option>'+(cat?.systems||[]).map(s=>`<option value="${s.id}"${s.id===selSys?' selected':''}>${s.name}</option>`).join('');fillImgStr(selStr)}
function fillImgStr(selStr){const catId=document.getElementById('im-cat').value;const sysId=document.getElementById('im-sys').value;const sys=gSys(catId,sysId);const ss=document.getElementById('im-str');ss.innerHTML='<option value="">Selecionar...</option>'+(sys?.structs||[]).map(s=>`<option value="${s.id}"${s.id===selStr?' selected':''}>${s.name}</option>`).join('');if(cST&&!selStr)ss.value=cST||''}
function closeImgModal(){hide('img-mo');eId=null;newPhotos=[];document.getElementById('img-fi').value=''}
function handleImgFiles(inp){const files=Array.from(inp.files);files.forEach(f=>{const isVid=f.type.startsWith('video/');const maxSize=isVid?200*1024*1024:8*1024*1024;if(f.size>maxSize){toast(`Máx. ${isVid?'200MB':'8MB'}`,'err');return}const rd=new FileReader();rd.onload=e=>{newPhotos.push(e.target.result);renderImgPreviews()};rd.readAsDataURL(f)});inp.value=''}
function renderImgPreviews(){const grid=document.getElementById('img-preview-grid');if(!grid)return;grid.innerHTML=newPhotos.map((p,i)=>`<div class="img-prev-item">${isVideo(p)?`<div style="background:#030a08;width:100%;height:100%;display:flex;align-items:center;justify-content:center"><i class="ti ti-video" style="font-size:22px;color:rgba(0,200,150,0.4)"></i></div><span class="img-prev-vid"><i class="ti ti-video"></i></span>`:`<img src="${p}" alt="">`}<button class="img-prev-del" onclick="removePreviewPhoto(${i})">✕</button></div>`).join('')}
function removePreviewPhoto(idx){newPhotos.splice(idx,1);renderImgPreviews()}
async function saveCase(){const catId=document.getElementById('im-cat').value,sysId=document.getElementById('im-sys').value,strId=document.getElementById('im-str').value,les=document.getElementById('im-les').value.trim();if(!catId||!sysId||!strId||!les){toast('Preencha todos os campos','err');return}const btn=document.getElementById('img-save-btn');btn.disabled=true;btn.textContent='Salvando...';const obj={id:eId||uid(),catId,sysId,strId,lesion:les,modality:document.getElementById('im-mod').value,category:document.getElementById('im-icat').value,level:document.getElementById('im-lvl').value.trim(),description:document.getElementById('im-desc').value.trim(),photos:newPhotos,date:eId?(cases.find(c=>c.id===eId)?.date||new Date().toISOString()):new Date().toISOString()};if(eId){const x=cases.findIndex(c=>c.id===eId);if(x>-1)cases[x]=obj}else cases.unshift(obj);schedDb();closeImgModal();btn.disabled=false;btn.innerHTML='<i class="ti ti-check" style="font-size:11px"></i> Salvar caso';updateStat();renderSB();if(cC&&cS&&cST)renderTab();else renderHome();toast(eId?'Caso atualizado':'Caso salvo','ok')}

// DELETE — sempre sincroniza home e galeria
function deleteCase(id){if(!confirm('Excluir este caso?'))return;cases=cases.filter(c=>c.id!==id);schedDb();updateStat();renderSB();if(cC&&cS&&cST)renderTab();else renderHome();toast('Caso removido','ok')}
function openAtlasFromCase(caseId){const c=cases.find(x=>x.id===caseId);if(!c)return;cC=c.catId;cS=c.sysId;cST=c.strId;cTab='atlas';cAtlas='read';document.getElementById('add-btn').style.display='flex';document.getElementById('pdf-btn').style.display='flex';const cat=gCat(c.catId);const sys=gSys(c.catId,c.sysId);const str=gStr(c.catId,c.sysId,c.strId);document.getElementById('bc').innerHTML=`<span class="bc" onclick="goHome()">${cat?.name||''}</span><i class="ti ti-chevron-right" style="font-size:9px"></i><span class="bc">${sys?.name||''}</span><i class="ti ti-chevron-right" style="font-size:9px"></i><span class="bc active">${str?.name||''}</span>`;renderSB();renderSP()}

// CATS — apaga casos vinculados
function openNC(){document.getElementById('nc-name').value='';show('nc-mo');setTimeout(()=>document.getElementById('nc-name').focus(),80)}
function saveNC(){const n=document.getElementById('nc-name').value.trim();if(!n)return;cats.push({id:uid(),name:n,systems:[]});schedC();renderSB();hide('nc-mo');toast('Categoria criada','ok')}
function delCat(id){if(!confirm('Remover esta categoria e todos os seus casos?'))return;cats=cats.filter(c=>c.id!==id);cases=cases.filter(c=>c.catId!==id);schedC();schedDb();if(cC===id){cC=null;cS=null;cST=null;goHome()}else{updateStat();renderSB();renderHome()};toast('Categoria removida','ok')}
function openNS(catId){nsCatId=catId;document.getElementById('ns-name').value='';show('ns-mo');setTimeout(()=>document.getElementById('ns-name').focus(),80)}
function saveNS(){const n=document.getElementById('ns-name').value.trim();if(!n)return;const cat=gCat(nsCatId);if(!cat)return;if(!cat.systems)cat.systems=[];cat.systems.push({id:uid(),name:n,structs:[]});schedC();renderSB();hide('ns-mo');toast('Sistema criado','ok')}
function delSys(cId,sId){if(!confirm('Remover este sistema e todos os seus casos?'))return;const cat=gCat(cId);if(cat)cat.systems=cat.systems.filter(s=>s.id!==sId);cases=cases.filter(c=>!(c.catId===cId&&c.sysId===sId));schedC();schedDb();if(cC===cId&&cS===sId){cS=null;cST=null;goHome()}else{updateStat();renderSB();renderHome()};toast('Sistema removido','ok')}
function openNST(catId,sysId){nstCatId=catId;nstSysId=sysId;document.getElementById('nst-name').value='';show('nst-mo');setTimeout(()=>document.getElementById('nst-name').focus(),80)}
function saveNST(){const n=document.getElementById('nst-name').value.trim();if(!n)return;const sys=gSys(nstCatId,nstSysId);if(!sys)return;if(!sys.structs)sys.structs=[];sys.structs.push({id:uid(),name:n});schedC();renderSB();hide('nst-mo');toast('Estrutura criada','ok')}
function delStr(cId,sId,stId){if(!confirm('Remover esta estrutura e todos os seus casos?'))return;const sys=gSys(cId,sId);if(sys)sys.structs=sys.structs.filter(s=>s.id!==stId);cases=cases.filter(c=>!(c.catId===cId&&c.sysId===sId&&c.strId===stId));schedC();schedDb();if(cC===cId&&cS===sId&&cST===stId){cST=null;goHome()}else{updateStat();renderSB();renderHome()};toast('Estrutura removida','ok')}

// PDF CASOS
async function exportAllPDF(){const list=cases.filter(c=>c.catId===cC&&c.sysId===cS&&c.strId===cST);if(!list.length){toast('Nenhum caso','err');return}await genCasePDF(list)}
async function genCasePDF(list){try{const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const W=210,H=297;for(let idx=0;idx<list.length;idx++){const c=list[idx];if(idx>0)doc.addPage();const cat=gCat(c.catId);const sys=gSys(c.catId,c.sysId);const str=gStr(c.catId,c.sysId,c.strId);const photos=(c.photos||[]).filter(p=>!isVideo(p));doc.setFillColor(7,21,16);doc.rect(0,0,W,H,'F');doc.setFillColor(13,32,24);doc.rect(6,6,W-12,22,'F');doc.setTextColor(0,200,150);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Ommathos',18,19);const cc=c.category==='normal'?[45,122,79]:c.category==='variante'?[146,96,10]:[185,28,28];doc.setFillColor(...cc);doc.roundedRect(12,33,32,8,1,1,'F');doc.setTextColor(255,255,255);doc.setFontSize(7);doc.text(bLbl(c.category).toUpperCase(),28,38.5,{align:'center'});doc.setTextColor(224,245,239);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(c.lesion+(c.level?' — '+c.level:''),12,50,{maxWidth:W-24});if(c.description){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(160,220,200);const lines=doc.splitTextToSize(c.description,W-24);doc.text(lines.slice(0,3),12,58)}let imgY=70;if(photos.length>0){const cols=photos.length===1?1:2;const cellW=(W-24-(cols-1)*4)/cols;for(let pi=0;pi<Math.min(photos.length,4);pi++){const col=pi%cols;const row=Math.floor(pi/cols);try{const img=new Image();await new Promise(res=>{img.onload=res;img.src=photos[pi]});const ratio=img.naturalHeight/img.naturalWidth;const iW=cellW;const iH=Math.min(iW*ratio,cellW*0.75);doc.addImage(photos[pi],'PNG',12+col*(cellW+4),imgY+row*(iH+4),iW,iH,'','MEDIUM')}catch(e){}}}doc.setTextColor(0,168,120);doc.setFontSize(7);doc.text('Clínica Senhor dos Passos · Ommathos',W/2,H-8,{align:'center'})}const str2=gStr(cC,cS,cST);doc.save(`ommathos-${str2?.name||'export'}-${new Date().toISOString().slice(0,10)}.pdf`);toast('PDF exportado!','ok')}catch(e){toast('Erro PDF','err');console.error(e)}}

// PDF ATLAS
async function exportAtlasPDF(){try{const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const W=210,H=297;const cat=gCat(cC);const sys=gSys(cC,cS);const str=gStr(cC,cS,cST);const k=wk();const w=wiki[k]||{};const illus=w.illus||[];const si=cases.filter(c=>c.catId===cC&&c.sysId===cS&&c.strId===cST);const caseImgs=si.flatMap(c=>(c.photos||[]).filter(p=>!isVideo(p))).slice(0,4);doc.setFillColor(7,21,16);doc.rect(0,0,W,H,'F');doc.setFillColor(13,32,24);doc.rect(0,0,W,30,'F');doc.setTextColor(0,200,150);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Ommathos',14,20);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Atlas · '+(cat?.name||'')+(sys?' › '+sys.name:''),58,21);doc.setFontSize(15);doc.setFont('helvetica','bold');doc.setTextColor(224,245,239);doc.text(str?.name||'',14,44);let y=54;[{id:'history',label:'HISTÓRIA'},{id:'anatomy',label:'ANATOMIA'},{id:'physio',label:'FISIOPATOLOGIA'},{id:'findings',label:'ACHADOS'},{id:'treatment',label:'TRATAMENTO'},{id:'refs',label:'REFERÊNCIAS'}].forEach(s=>{if(!w[s.id])return;if(y>H-20){doc.addPage();doc.setFillColor(7,21,16);doc.rect(0,0,W,H,'F');y=20}doc.setFillColor(0,120,80);doc.roundedRect(10,y-4,W-20,7,1,1,'F');doc.setTextColor(224,245,239);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(s.label,14,y+0.5);y+=9;doc.setTextColor(160,220,200);doc.setFont('helvetica','normal');doc.setFontSize(9);const lines=doc.splitTextToSize(w[s.id],W-24);lines.forEach(line=>{if(y>H-15){doc.addPage();doc.setFillColor(7,21,16);doc.rect(0,0,W,H,'F');y=20}doc.text(line,12,y);y+=5.5});y+=6});if(illus.length>0||caseImgs.length>0){doc.addPage();doc.setFillColor(7,21,16);doc.rect(0,0,W,H,'F');doc.setFillColor(13,32,24);doc.rect(0,0,W,22,'F');doc.setTextColor(0,200,150);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Imagens — '+(str?.name||''),14,14);let iy=28;const allImgs=[...illus,...caseImgs];const cols=2,cW=(W-24-4)/2;for(let i=0;i<Math.min(allImgs.length,6);i++){const col=i%cols,row=Math.floor(i/cols);try{const img=new Image();await new Promise(res=>{img.onload=res;img.src=allImgs[i]});const ratio=img.naturalHeight/img.naturalWidth;const iW=cW,iH=Math.min(iW*ratio,cW*0.75);doc.addImage(allImgs[i],'PNG',12+col*(cW+4),iy+row*(iH+6),iW,iH,'','MEDIUM')}catch(e){}}}const pc=doc.internal.getNumberOfPages();for(let i=1;i<=pc;i++){doc.setPage(i);doc.setTextColor(0,120,80);doc.setFontSize(7);doc.text('Clínica Senhor dos Passos · Ommathos',W/2,H-8,{align:'center'});doc.text(`${i}/${pc}`,W-12,H-8,{align:'right'})}doc.save(`ommathos-atlas-${str?.name||'export'}.pdf`);toast('Atlas PDF exportado!','ok')}catch(e){toast('Erro PDF','err');console.error(e)}}

function bCls(c){return c==='normal'?'b-norm':c==='variante'?'b-var':'b-pat'}
function bLbl(c){return c==='normal'?'Normal':c==='variante'?'Variante':'Patologia'}
function updateStat(){const t=cases.length;document.getElementById('top-stat').textContent=t+' caso'+(t!==1?'s':'')}
function toast(msg,type='ok'){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.className=`toast show ${type}`;t.querySelector('i').className=type==='ok'?'ti ti-check':'ti ti-alert-circle';setTimeout(()=>{t.className='toast'},2800)}

window.onload=()=>{initGoogleAuth();animateLogos()}
</script>
